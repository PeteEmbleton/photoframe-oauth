<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Frame — Sign-in code</title>
</head>
<body>
  <h1>Send this back to the frame</h1>
  <p id="msg">Enter the frame URL (same WiFi), then tap Send.</p>
  <p>
    <input id="frame" type="url" size="36" placeholder="http://192.168.x.x:8080" />
  </p>
  <p><button id="send" type="button">Send to frame</button></p>
  <p id="err"></p>
  <p>Or hold this QR up to the frame camera:</p>
  <div id="qr"></div>
  <p><code id="raw"></code></p>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var err = params.get("error");
      var code = params.get("code");
      var state = params.get("state") || "";
      if (err) {
        document.getElementById("err").textContent = "Google error: " + err;
        return;
      }
      if (!code) {
        document.getElementById("err").textContent = "No code in URL. Open this page only via Google redirect.";
        return;
      }
      var saved = localStorage.getItem("photoframe_admin") || "";
      document.getElementById("frame").value = saved;
      document.getElementById("send").onclick = function () {
        var base = (document.getElementById("frame").value || "").replace(/\/$/, "");
        if (!base) {
          document.getElementById("err").textContent = "Enter the frame URL first.";
          return;
        }
        localStorage.setItem("photoframe_admin", base);
        var u = base + "/oauth/finish?code=" + encodeURIComponent(code);
        if (state) u += "&state=" + encodeURIComponent(state);
        window.location.href = u;
      };
      var payload = "photoframe-oauth:" + code;
      document.getElementById("raw").textContent = payload;
      QRCode.toCanvas(document.createElement("canvas"), payload, {
        width: 240,
        margin: 2,
        errorCorrectionLevel: "M"
      }, function (e, canvas) {
        if (e) {
          document.getElementById("err").textContent = String(e);
          return;
        }
        document.getElementById("qr").appendChild(canvas);
      });
    })();
  </script>
</body>
</html>
